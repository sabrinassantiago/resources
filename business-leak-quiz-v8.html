<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Business Leak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #a70101;
    --black: #1a1a1a;
    --white: #ffffff;
    --cream: #f7f4f0;
    --cream-dark: #ede9e3;
    --gray: #c8c2ba;
    --muted: #8c8078;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--black);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── HERO HEADER ── */
  .hero {
    background: var(--black);
    padding: 64px 32px 56px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: 'LEAK';
    position: absolute;
    right: -20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: clamp(120px, 18vw, 200px);
    color: rgba(255,255,255,0.04);
    line-height: 1;
    pointer-events: none;
    white-space: nowrap;
  }

  .hero-inner {
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .eyebrow::before {
    content: '';
    display: block;
    width: 28px;
    height: 2px;
    background: var(--red);
    flex-shrink: 0;
  }

  h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(52px, 9vw, 88px);
    line-height: 0.95;
    color: var(--white);
    font-weight: 400;
    margin-bottom: 28px;
  }

  h1 em {
    font-style: italic;
    color: var(--red);
    display: block;
  }

  .subtitle {
    font-size: 14px;
    color: rgba(247,244,240,0.55);
    line-height: 1.8;
    max-width: 440px;
    font-weight: 400;
    border-left: 2px solid var(--red);
    padding-left: 16px;
  }

  /* ── QUIZ BODY ── */
  .body-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 100px;
  }

  /* ── PROGRESS ── */
  .progress-wrap {
    margin-bottom: 32px;
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .progress-count {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .progress-num {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 28px;
    color: var(--black);
    line-height: 1;
  }

  .progress-track {
    height: 3px;
    background: var(--cream-dark);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--red);
    transition: width 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--white);
    border-top: 4px solid var(--red);
    padding: 0;
    animation: slideUp 0.3s ease both;
    box-shadow: 0 8px 40px rgba(26,26,26,0.10);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .question-text {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(22px, 3.8vw, 32px);
    line-height: 1.2;
    color: var(--black);
    font-weight: 400;
    padding: 32px 36px 28px;
    border-bottom: 1px solid var(--cream-dark);
  }

  .answers {
    display: flex;
    flex-direction: column;
  }

  .answer-btn {
    background: var(--white);
    border: none;
    border-bottom: 1px solid var(--cream-dark);
    color: var(--black);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    padding: 20px 36px;
    text-align: left;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, padding-left 0.2s;
    line-height: 1.5;
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .answer-btn:last-child {
    border-bottom: none;
  }

  .answer-letter {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--gray);
    flex-shrink: 0;
    width: 18px;
    transition: color 0.18s;
  }

  .answer-btn:hover {
    background: var(--cream);
    padding-left: 48px;
    color: var(--black);
  }

  .answer-btn:hover .answer-letter {
    color: var(--red);
  }

  .answer-btn.selected {
    background: var(--red);
    color: var(--white);
    padding-left: 48px;
  }

  .answer-btn.selected .answer-letter {
    color: rgba(255,255,255,0.6);
  }

  .answer-btn.selected::after {
    content: '✓';
    position: absolute;
    right: 24px;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
  }

  /* ── NAV ── */
  .nav-btns {
    display: flex;
    margin-top: 14px;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--gray);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 0;
    transition: color 0.2s;
  }

  .back-btn:hover { color: var(--black); }
  .back-btn:disabled { opacity: 0.25; cursor: default; }

  /* ── RESULT ── */
  .result-wrap {
    animation: slideUp 0.4s ease both;
  }

  .result-hero {
    background: var(--black);
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }

  .result-hero::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--red);
  }

  .result-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .result-tag::before {
    content: '';
    width: 20px;
    height: 2px;
    background: var(--red);
    flex-shrink: 0;
  }

  .result-title {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(38px, 6vw, 60px);
    line-height: 1.0;
    color: var(--white);
    font-weight: 400;
  }

  .result-title em {
    font-style: italic;
    color: var(--red);
    display: block;
  }

  .result-body {
    background: var(--white);
    box-shadow: 0 8px 40px rgba(26,26,26,0.10);
  }

  .result-desc {
    font-size: 15px;
    line-height: 1.85;
    color: var(--muted);
    padding: 32px 36px;
    border-bottom: 1px solid var(--cream-dark);
  }

  /* SIGNS */
  .result-signs {
    padding: 28px 36px;
    border-bottom: 1px solid var(--cream-dark);
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 20px;
  }

  .signs-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .sign-item {
    display: flex;
    align-items: flex-start;
    gap: 0;
    border-bottom: 1px solid var(--cream-dark);
    padding: 14px 0;
  }

  .sign-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .sign-item:first-child {
    padding-top: 0;
  }

  .sign-arrow {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--red);
    flex-shrink: 0;
    margin-right: 14px;
    margin-top: 1px;
  }

  .sign-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--black);
  }

  /* SCORE BREAKDOWN */
  .score-breakdown {
    padding: 28px 36px;
    border-bottom: 1px solid var(--cream-dark);
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .score-row:last-child { margin-bottom: 0; }

  .score-label {
    font-size: 12px;
    font-weight: 400;
    width: 180px;
    flex-shrink: 0;
    color: var(--gray);
  }

  .score-label.winner {
    color: var(--black);
    font-weight: 700;
  }

  .score-track {
    flex: 1;
    height: 4px;
    background: var(--cream-dark);
    overflow: hidden;
  }

  .score-bar {
    height: 100%;
    background: var(--cream-dark);
    transition: width 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    width: 0%;
  }

  .score-pct {
    font-size: 12px;
    width: 36px;
    text-align: right;
    color: var(--gray);
    flex-shrink: 0;
  }

  .score-pct.winner {
    color: var(--red);
    font-weight: 700;
  }

  /* RESTART */
  .download-area {
    padding: 32px 36px;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .download-cta {
    font-size: 13px;
    color: rgba(247,244,240,0.55);
    line-height: 1.75;
    max-width: 300px;
  }

  .download-cta strong {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--white);
    font-weight: 400;
    margin-bottom: 4px;
  }

  .download-btn {
    background: var(--red);
    color: var(--white);
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 16px 28px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .download-btn:hover {
    background: #8a0101;
    transform: translateY(-2px);
  }

  .restart-link {
    display: block;
    text-align: center;
    padding: 16px 36px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray);
    cursor: pointer;
    border-top: 1px solid var(--cream-dark);
    background: none;
    border-left: none;
    border-right: none;
    border-bottom: none;
    width: 100%;
    font-family: 'Inter', sans-serif;
    transition: color 0.2s;
  }

  .restart-link:hover { color: var(--black); }

  /* ── FOOTER ── */
  .footer {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--cream-dark);
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
  }

  .footer a {
    color: var(--black);
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s;
  }

  .footer a:hover { color: var(--red); }

  @media (max-width: 560px) {
    .hero { padding: 48px 24px 44px; }
    .question-text { padding: 24px; }
    .answer-btn { padding: 18px 24px; }
    .answer-btn:hover, .answer-btn.selected { padding-left: 32px; }
    .result-hero, .result-desc, .result-signs, .score-breakdown, .download-area { padding-left: 24px; padding-right: 24px; }
    .score-label { width: 130px; }
    .download-area { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Business Diagnosis</div>
    <h1>Find Your<em>Business Leak</em></h1>
    <p class="subtitle">Not every money problem is a pricing problem. Answer 16 honest questions and find out exactly where your business is leaking, before you fix the wrong thing.</p>
  </div>
</div>

<!-- QUIZ -->
<div class="body-wrap">
  <div id="quiz-area"></div>

  <div class="footer">
    Created by <a href="https://www.linkedin.com/in/sabrss" target="_blank">Sabrina S. Santiago</a>, your favorite freelancer. All rights reserved.
  </div>
</div>

<script>
  const questions = [
    {
      text: 'Do most clients say yes to your price without questioning it?',
      answers: [
        { label: 'Yes, almost always',   scores: [3, 0, 0, 0] },
        { label: 'Sometimes',            scores: [1, 0, 0, 0] },
        { label: 'Rarely or never',      scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'Do you feel like you work a lot but don\'t make enough?',
      answers: [
        { label: 'Yes, definitely',      scores: [3, 0, 0, 0] },
        { label: 'Sometimes',            scores: [1, 0, 0, 0] },
        { label: 'No, I\'m okay',        scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'Do you need many clients at once just to pay your bills?',
      answers: [
        { label: 'Yes, always juggling many',  scores: [3, 0, 0, 0] },
        { label: 'Sometimes',                  scores: [1, 0, 0, 0] },
        { label: 'No, a few is enough',        scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'Are you hitting your income goal with your current clients?',
      answers: [
        { label: 'No, I always fall short',  scores: [2, 0, 0, 0] },
        { label: 'Kind of, but barely',      scores: [1, 0, 0, 0] },
        { label: 'Yes, I\'m comfortable',    scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'Can most people who contact you actually pay your rates?',
      answers: [
        { label: 'Rarely, most can\'t pay my rates', scores: [0, 0, 3, 0] },
        { label: 'Sometimes',                        scores: [0, 0, 1, 0] },
        { label: 'Usually yes',                      scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'Where do most of your leads come from?',
      answers: [
        { label: 'Cheap platforms or referrals from cheap clients',       scores: [0, 0, 3, 0] },
        { label: 'A mix of both',                                         scores: [0, 0, 1, 0] },
        { label: 'LinkedIn, content, direct outreach, quality referrals', scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'Do people ask about price or compare you to cheaper options in their very first message?',
      answers: [
        { label: 'Yes, almost always',  scores: [0, 0, 3, 0] },
        { label: 'Sometimes',           scores: [0, 0, 1, 0] },
        { label: 'Rarely',              scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'Do your conversations usually reach the proposal stage?',
      answers: [
        { label: 'Rarely, most fizzle out before', scores: [0, 0, 1, 2] },
        { label: 'About half make it',             scores: [0, 0, 0, 1] },
        { label: 'Usually yes',                    scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'What happens after most discovery calls?',
      answers: [
        { label: 'They vanish or say they can\'t pay',            scores: [0, 0, 2, 1] },
        { label: 'I don\'t know how to get them to move forward', scores: [0, 0, 0, 3] },
        { label: 'They usually move forward',                     scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'The people who drop off before a proposal: are they a good fit for your work?',
      answers: [
        { label: 'No, wrong type of client',         scores: [0, 0, 3, 0] },
        { label: 'Sometimes right, sometimes wrong', scores: [0, 0, 1, 1] },
        { label: 'Yes, they seem like a great fit',  scores: [0, 0, 0, 2] },
      ]
    },
    {
      text: 'What usually happens after you send a proposal?',
      answers: [
        { label: 'They ghost completely',   scores: [0, 0, 1, 2] },
        { label: 'They push back on price', scores: [0, 1, 0, 2] },
        { label: 'They say yes',            scores: [1, 0, 0, 0] },
      ]
    },
    {
      text: 'Before sending a proposal, do you talk about budget and expectations?',
      answers: [
        { label: 'No, I just send it',                       scores: [0, 0, 0, 3] },
        { label: 'Sometimes',                                scores: [0, 0, 0, 1] },
        { label: 'Yes, always, and the budget seemed fine',  scores: [0, 2, 0, 0] },
      ]
    },
    {
      text: 'When a client pushes back on price, what do you do first?',
      answers: [
        { label: 'Drop my price right away',               scores: [0, 0, 0, 3] },
        { label: 'Try to hold but usually cave eventually', scores: [0, 0, 0, 2] },
        { label: 'Hold my price and explain the value',    scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'When you hold your price, what usually happens?',
      answers: [
        { label: 'They walk away',   scores: [0, 2, 0, 0] },
        { label: 'About half stay',  scores: [0, 1, 0, 0] },
        { label: 'They hire me',     scores: [0, 0, 0, 0] },
      ]
    },
    {
      text: 'The clients you lose: are they the type you actually want? Right budget, right industry, right fit?',
      answers: [
        { label: 'No, most are not the right fit',  scores: [0, 0, 3, 0] },
        { label: 'It\'s a mix',                     scores: [0, 0, 1, 1] },
        { label: 'Yes, exactly who I want',         scores: [0, 1, 0, 0] },
      ]
    },
    {
      text: 'Does this keep happening with good clients across all your channels, not just one?',
      answers: [
        { label: 'Yes, it happens everywhere with all kinds of good clients', scores: [0, 3, 0, 0] },
        { label: 'Mainly in one channel or with one type of client',          scores: [0, 0, 2, 0] },
        { label: 'It feels random, no clear pattern',                         scores: [0, 1, 0, 1] },
      ]
    },
  ];

  const results = {
    pricing_low: {
      tag: 'Pricing Problem',
      title: 'You\'re Charging',
      titleEm: 'Too Little',
      desc: 'Clients say yes fast, but you\'re tired and the money never adds up. Your rate doesn\'t match what you actually deliver or what it costs to run your business. The price feels easy to say yes to because it is too easy.',
      signs: [
        'Clients accept your price with zero pushback',
        'You need a lot of clients at the same time to pay your bills',
        'You feel overworked for what you make',
        'Your income goal feels out of reach no matter how much you work',
      ]
    },
    pricing_high: {
      tag: 'Pricing Problem',
      title: 'Your Rate Is Ahead',
      titleEm: 'of Your Proof',
      desc: 'The right people show up. The calls go well. But the number kills deals every time. Your rate is ahead of what your work, portfolio, or name can back up right now. That\'s not a sales problem. That\'s a pricing problem.',
      signs: [
        'Good calls that die the moment you send the number',
        'Good clients keep saying no to your price',
        'This happens no matter where the client comes from',
        'Dropping your rate a little would likely close more deals',
      ]
    },
    positioning: {
      tag: 'Positioning Problem',
      title: 'The Wrong People',
      titleEm: 'Are Finding You',
      desc: 'Your rate is not the main problem. The problem is who is finding you. Your message, channel, or platform is pulling in people who were never going to pay your rates. Better sales skills won\'t fix this. You need to change who shows up.',
      signs: [
        'People compare you to much cheaper options right away',
        'Most of your leads come from platforms that pull in cheap clients',
        'Even good calls end because people don\'t have the money',
        'The right kind of client almost never finds you',
      ]
    },
    sales: {
      tag: 'Sales & Negotiation Problem',
      title: 'The Value Isn\'t',
      titleEm: 'Landing',
      desc: 'The right people are showing up and the money is there. But something in the conversation breaks the deal. The value isn\'t landing. Or you drop your price before they even push back. The problem is not your rate. It\'s what happens in the room.',
      signs: [
        'You talk about what you do instead of what the client gets',
        'You lower your price before clients even ask',
        'Clients go quiet after calls that felt like they went well',
        'You don\'t know how to move people forward after a call',
      ]
    },
  };

  const signTriggers = [
    { q: 0, a: 0, cat: 0, sign: 'Clients almost always say yes to your price without pushing back' },
    { q: 0, a: 1, cat: 0, sign: 'Clients often say yes to your price without asking for a lower one' },
    { q: 1, a: 0, cat: 0, sign: 'You work a lot but the money never feels like enough' },
    { q: 1, a: 1, cat: 0, sign: 'You sometimes feel like you work more than you get paid for' },
    { q: 2, a: 0, cat: 0, sign: 'You need a lot of clients at once just to pay your bills' },
    { q: 2, a: 1, cat: 0, sign: 'Some months you need to stack clients to hit your income goal' },
    { q: 3, a: 0, cat: 0, sign: 'You keep falling short of your income goal no matter how much you work' },
    { q: 3, a: 1, cat: 0, sign: 'You barely make your income goal even when fully booked' },
    { q: 4, a: 0, cat: 2, sign: 'Most people who reach out can\'t pay your rates from the start' },
    { q: 4, a: 1, cat: 2, sign: 'A lot of people who contact you don\'t have the money for your work' },
    { q: 5, a: 0, cat: 2, sign: 'Most of your leads come from platforms that pull in cheap clients' },
    { q: 5, a: 1, cat: 2, sign: 'Some of where you get leads is pulling in the wrong kind of client' },
    { q: 6, a: 0, cat: 2, sign: 'People compare you to way cheaper options before the call even starts' },
    { q: 6, a: 1, cat: 2, sign: 'Some leads bring up cheaper options in the very first few messages' },
    { q: 7, a: 0, cat: 3, sign: 'Most of your conversations die before you even send a proposal' },
    { q: 7, a: 1, cat: 3, sign: 'About half your conversations stop before the proposal stage' },
    { q: 8, a: 0, cat: 2, sign: 'People go quiet or say they can\'t pay after discovery calls' },
    { q: 8, a: 1, cat: 3, sign: 'You don\'t know how to move people forward after a discovery call' },
    { q: 9, a: 0, cat: 2, sign: 'The people who drop off before a proposal are the wrong type of client' },
    { q: 9, a: 2, cat: 3, sign: 'The people you lose before the proposal are exactly who you want' },
    { q: 10, a: 0, cat: 3, sign: 'Clients go quiet after getting your proposal' },
    { q: 10, a: 1, cat: 1, sign: 'Clients keep pushing back on your price after seeing the proposal' },
    { q: 10, a: 2, cat: 0, sign: 'Clients say yes to your proposals without any back and forth' },
    { q: 11, a: 0, cat: 3, sign: 'You send proposals without talking about budget or what they expect to pay' },
    { q: 11, a: 2, cat: 1, sign: 'Budget seemed fine but clients still went cold after seeing the number' },
    { q: 12, a: 0, cat: 3, sign: 'You lower your price the second someone questions it' },
    { q: 12, a: 1, cat: 3, sign: 'You try to hold your price but you usually give in when it gets uncomfortable' },
    { q: 13, a: 0, cat: 1, sign: 'When you hold your price, clients walk away' },
    { q: 13, a: 1, cat: 1, sign: 'About half the clients leave when you don\'t lower your price' },
    { q: 14, a: 0, cat: 2, sign: 'Most of the clients you lose were never a good fit anyway' },
    { q: 14, a: 2, cat: 1, sign: 'You keep losing exactly the type of client you want to work with' },
    { q: 15, a: 0, cat: 1, sign: 'This keeps happening with good clients no matter where they come from' },
    { q: 15, a: 1, cat: 2, sign: 'Most of your losses come from one channel or one type of client' },
  ];

  function getPersonalizedSigns(winnerIndex, answersArr) {
    const matched = signTriggers
      .filter(t => t.cat === winnerIndex && answersArr[t.q] === t.a)
      .map(t => t.sign);
    return [...new Set(matched)].slice(0, 4);
  }

  const keys = ['pricing_low', 'pricing_high', 'positioning', 'sales'];
  const letters = ['A', 'B', 'C'];

  let answers = new Array(questions.length).fill(null);
  let current = 0;
  let advanceTimer = null;

  function render() {
    const area = document.getElementById('quiz-area');
    const pct = Math.round((current / questions.length) * 100);

    area.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-top">
          <span class="progress-count">Question ${current + 1} of ${questions.length}</span>
          <span class="progress-num">${pct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${pct}%"></div>
        </div>
      </div>
      <div class="question-card">
        <div class="question-text">${questions[current].text}</div>
        <div class="answers">
          ${questions[current].answers.map((a, i) => `
            <button
              class="answer-btn ${answers[current] === i ? 'selected' : ''}"
              onclick="selectAnswer(${i})"
            >
              <span class="answer-letter">${letters[i]}</span>
              ${a.label}
            </button>
          `).join('')}
        </div>
      </div>
      <div class="nav-btns">
        <button class="back-btn" onclick="goBack()" ${current === 0 ? 'disabled' : ''}>← Back</button>
      </div>
    `;
  }

  function selectAnswer(i) {
    answers[current] = i;
    render();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(() => goNext(), 420);
  }

  function goNext() {
    if (answers[current] === null) return;
    if (current === questions.length - 1) { showResult(); return; }
    current++;
    render();
  }

  function goBack() {
    clearTimeout(advanceTimer);
    if (current === 0) return;
    current--;
    render();
  }

  function showResult() {
    const totals = [0, 0, 0, 0];
    answers.forEach((answerIndex, qIndex) => {
      if (answerIndex === null) return;
      const s = questions[qIndex].answers[answerIndex].scores;
      s.forEach((val, i) => totals[i] += val);
    });

    const max = Math.max(...totals);
    const winnerIndex = totals.indexOf(max);
    const r = results[keys[winnerIndex]];
    const total = totals.reduce((a, b) => a + b, 0) || 1;

    const displayTotals = [totals[0] + totals[1], totals[2], totals[3]];
    const displayLabels = ['Pricing', 'Positioning', 'Sales & Negotiation'];
    const displayWinner = winnerIndex <= 1 ? 0 : winnerIndex - 1;

    const personalizedSigns = getPersonalizedSigns(winnerIndex, answers);
    const signsToShow = personalizedSigns.length >= 2 ? personalizedSigns : r.signs;

    document.getElementById('quiz-area').innerHTML = `
      <div class="result-wrap">
        <div class="result-hero">
          <div class="result-tag">${r.tag}</div>
          <div class="result-title">${r.title}<em>${r.titleEm}</em></div>
        </div>
        <div class="result-body">
          <div class="result-desc">${r.desc}</div>
          <div class="result-signs">
            <div class="section-label">${personalizedSigns.length >= 2 ? 'From your answers' : 'Signs that match'}</div>
            <div class="signs-list">
              ${signsToShow.map(s => `
                <div class="sign-item">
                  <span class="sign-arrow">→</span>
                  <span class="sign-text">${s}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="score-breakdown">
            <div class="section-label">Your score breakdown</div>
            ${displayLabels.map((label, i) => {
              const pct = Math.round((displayTotals[i] / total) * 100);
              const isWinner = i === displayWinner;
              return `
                <div class="score-row">
                  <div class="score-label ${isWinner ? 'winner' : ''}">${label}</div>
                  <div class="score-track">
                    <div class="score-bar" id="bar-${i}" style="background: ${isWinner ? 'var(--red)' : 'var(--gray)'}; width: 0%"></div>
                  </div>
                  <div class="score-pct ${isWinner ? 'winner' : ''}">${pct}%</div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="download-area">
            <div class="download-cta">
              <strong>You did the work. Take the answer with you.</strong>
              Save your diagnosis and the answers you gave, so you don't lose this somewhere in a tab.
            </div>
            <button class="download-btn" onclick="downloadPDF()">
              ↓ Download your results
            </button>
          </div>
          <button class="restart-link" onclick="restart()">Start over</button>
        </div>
      </div>
    `;

    setTimeout(() => {
      displayTotals.forEach((val, i) => {
        const pct = Math.round((val / total) * 100);
        const bar = document.getElementById(`bar-${i}`);
        if (bar) bar.style.width = pct + '%';
      });
    }, 100);
  }

  function downloadPDF() {
    const totals = [0, 0, 0, 0];
    answers.forEach((answerIndex, qIndex) => {
      if (answerIndex === null) return;
      questions[qIndex].answers[answerIndex].scores.forEach((val, i) => totals[i] += val);
    });
    const winnerIndex = totals.indexOf(Math.max(...totals));
    const r = results[keys[winnerIndex]];

    const answerRows = questions.map((q, i) => {
      const chosen = answers[i] !== null ? q.answers[answers[i]].label : '—';
      return `
        <tr>
          <td class="q-num">${i + 1}</td>
          <td class="q-text">${q.text}</td>
          <td class="q-answer">${chosen}</td>
        </tr>`;
    }).join('');

    const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Business Leak Diagnosis</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; color: #1a1a1a; background: #fff; padding: 48px 56px; }
  .top-bar { height: 4px; background: #a70101; margin-bottom: 48px; }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #a70101; margin-bottom: 12px; }
  h1 { font-family: 'Instrument Serif', serif; font-size: 52px; line-height: 1.0; color: #1a1a1a; font-weight: 400; margin-bottom: 6px; }
  h1 em { font-style: italic; color: #a70101; }
  .desc { font-size: 14px; line-height: 1.85; color: #8c8078; margin: 20px 0 32px; border-left: 2px solid #ede9e3; padding-left: 16px; max-width: 520px; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #c8c2ba; margin-bottom: 14px; }
  .signs { margin-bottom: 40px; }
  .sign { display: flex; gap: 12px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; }
  .sign-arrow { color: #a70101; font-family: 'Instrument Serif', serif; font-style: italic; flex-shrink: 0; }
  .divider { height: 1px; background: #ede9e3; margin: 32px 0; }
  h2 { font-family: 'Instrument Serif', serif; font-size: 22px; color: #1a1a1a; font-weight: 400; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #c8c2ba; padding: 0 0 10px; border-bottom: 1px solid #ede9e3; }
  td { padding: 12px 0; border-bottom: 1px solid #f7f4f0; vertical-align: top; }
  .q-num { color: #a70101; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 14px; width: 28px; padding-right: 8px; }
  .q-text { color: #1a1a1a; line-height: 1.5; padding-right: 20px; }
  .q-answer { color: #8c8078; font-weight: 600; width: 200px; }
  .footer { margin-top: 48px; font-size: 11px; color: #c8c2ba; }
  @media print { body { padding: 32px 40px; } }
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="eyebrow">${r.tag}</div>
<h1>${r.title}<em>${r.titleEm}</em></h1>
<p class="desc">${r.desc}</p>
<div class="signs">
  <div class="section-label">Signs that match you</div>
  ${r.signs.map(s => `<div class="sign"><span class="sign-arrow">→</span><span>${s}</span></div>`).join('')}
</div>
<div class="divider"></div>
<h2>Your answers</h2>
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Question</th>
      <th>Your answer</th>
    </tr>
  </thead>
  <tbody>${answerRows}</tbody>
</table>
<div class="footer">Created by Sabrina S. Santiago — sabrinassantiago.com</div>
</body>
</html>`;

    const win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
    win.onload = () => { win.focus(); win.print(); };
  }

  function restart() {
    clearTimeout(advanceTimer);
    answers = new Array(questions.length).fill(null);
    current = 0;
    render();
  }

  render();
</script>
</body>
</html>
