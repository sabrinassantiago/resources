<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hidden Cash Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ── Hidden Cash Calculator · styles ───────────────────────────────────────── */
:root {
  --red: #A60303;
  --red-deep: #7d0202;
  --cream: #F7F4F0;
  --ink: #1A1A1A;
  --card: #FFFFFF;
  --line: rgba(26, 26, 26, 0.12);
  --line-soft: rgba(26, 26, 26, 0.07);
  --muted: rgba(26, 26, 26, 0.58);
  --muted-2: rgba(26, 26, 26, 0.42);
  --cream-on-red: #F7E9E3;
  --good: #2f7d4f;
  --shadow: 0 1px 0 rgba(26,26,26,0.04), 0 18px 40px -24px rgba(26,26,26,0.22);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.serif {
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400;
  letter-spacing: -0.01em;
}

.shell { max-width: 1180px; margin: 0 auto; padding: 0 28px 120px; }

.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted-2);
}

/* ── Header ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 0 0; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand .dot {
  width: 13px; height: 13px; border-radius: 50%; background: var(--red);
  box-shadow: 0 0 0 4px rgba(166,3,3,0.12);
}
.brand .wm { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
.toolbtns { display: flex; gap: 10px; }
.btn {
  font-family: inherit; font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 9px 15px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: transform .12s ease, background .12s ease, border-color .12s ease;
}
.btn:hover { transform: translateY(-1px); border-color: rgba(26,26,26,0.28); }
.btn:active { transform: translateY(0); }
.btn--red { background: var(--red); color: var(--cream); border-color: var(--red); }
.btn--red:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn--ghost { background: transparent; }

.hero-head { padding: 40px 0 30px; max-width: 820px; }
.hero-head h1 {
  font-family: "Instrument Serif", serif; font-weight: 400;
  font-size: clamp(52px, 8.5vw, 104px); line-height: 0.92; margin: 0 0 18px;
  letter-spacing: -0.02em;
}
.hero-head h1 .ital { font-style: italic; color: var(--red); }
.hero-head .lede { font-size: 17px; color: var(--ink); max-width: 640px; }
.hero-head .lede .sass {
  font-family: "Instrument Serif", serif; font-size: 26px; font-style: italic;
  display: block; margin-bottom: 10px; letter-spacing: -0.01em;
}
.hero-head .lede .muted { color: var(--muted); }

/* ── Section header ── */
.sec-head { display: flex; align-items: baseline; gap: 14px; margin: 64px 0 20px; }
.sec-head .no {
  font-family: "Instrument Serif", serif; font-size: 22px; color: var(--red);
  font-style: italic;
}
.sec-head h2 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sec-head .hint { color: var(--muted); font-size: 13.5px; margin-left: auto; }

/* ── Input table ── */
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); overflow: hidden;
}
.tbl-wrap { overflow-x: auto; }
table.clients { width: 100%; border-collapse: collapse; min-width: 860px; }
table.clients thead th {
  text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted-2);
  padding: 16px 14px; border-bottom: 1px solid var(--line);
  white-space: nowrap; background: #FCFBF9;
}
table.clients thead th.num { text-align: right; }
table.clients tbody td { padding: 4px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.clients tbody tr:last-child td { border-bottom: none; }
.cell {
  display: flex; align-items: center; gap: 2px; border-radius: 9px;
  border: 1px solid transparent; transition: border-color .12s, background .12s;
  padding: 0 8px;
}
.cell:focus-within { border-color: var(--red); background: #fff; }
.cell.cur::before { content: "$"; color: var(--muted-2); font-size: 14px; }
.cell input {
  font-family: inherit; font-size: 14.5px; color: var(--ink);
  border: none; background: transparent; width: 100%; padding: 11px 4px; outline: none;
}
.cell input::placeholder { color: var(--muted-2); }
.cell.name input { font-weight: 600; }
.cell.num input { text-align: right; }
td.del { width: 40px; }
.delbtn {
  border: none; background: transparent; color: var(--muted-2); cursor: pointer;
  width: 30px; height: 30px; border-radius: 8px; font-size: 16px; line-height: 1;
  display: grid; place-items: center; transition: background .12s, color .12s;
}
.delbtn:hover { background: rgba(166,3,3,0.09); color: var(--red); }
.tbl-foot { display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; gap: 12px; flex-wrap: wrap; }
.add-row {
  border: 1px dashed rgba(26,26,26,0.3); background: transparent; color: var(--ink);
  font-family: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer;
  padding: 10px 16px; border-radius: 999px; transition: background .12s, border-color .12s;
}
.add-row:hover { background: #fff; border-color: var(--red); color: var(--red); }
.foot-note { font-size: 12.5px; color: var(--muted); }

/* ── Waiting state ── */
.waiting-dash {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 56px 32px; text-align: center; box-shadow: var(--shadow);
}
.waiting-dash .wi { font-size: 36px; margin-bottom: 14px; }
.waiting-dash p {
  font-family: "Instrument Serif", serif; font-size: 22px; font-style: italic;
  color: var(--muted); margin: 0 auto; letter-spacing: -0.01em; max-width: 460px;
}

/* ── Dashboard grid ── */
.dash { display: grid; grid-template-columns: 1.32fr 1fr; gap: 18px; }
.dash .col { display: grid; gap: 18px; }
.trio { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 24px; box-shadow: var(--shadow);
}
.card .klabel { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card .kval { font-family: "Instrument Serif", serif; line-height: 0.95; letter-spacing: -0.02em; }
.card .kdesc { font-size: 13.5px; color: var(--muted); margin-top: 12px; line-height: 1.55; }

/* hero hidden-cash card */
.hero-card {
  background: var(--red); color: var(--cream); border-color: var(--red);
  border-radius: 22px; padding: 34px; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
.hero-card::after {
  content: ""; position: absolute; right: -90px; top: -90px; width: 280px; height: 280px;
  border-radius: 50%; background: rgba(255,255,255,0.06);
}
.hero-card .klabel { color: var(--cream-on-red); }
.hero-card .eyebrow { color: rgba(247,233,227,0.72); }
.hero-card .kval { font-size: clamp(58px, 8vw, 96px); margin: 6px 0; }
.hero-card .kdesc { color: rgba(247,233,227,0.92); font-size: 14.5px; max-width: 460px; }
.hero-card .breathe { font-family: "Instrument Serif", serif; font-style: italic;
  font-size: 22px; color: var(--cream); margin-bottom: 2px; }
.hero-card .pulse { display:inline-block; width:8px; height:8px; border-radius:50%;
  background: var(--cream); box-shadow: 0 0 0 0 rgba(247,244,240,0.6); animation: pulse 2.4s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(247,244,240,0.5)} 70%{box-shadow:0 0 0 12px rgba(247,244,240,0)} 100%{box-shadow:0 0 0 0 rgba(247,244,240,0)} }

.card .kval.big { font-size: clamp(40px, 5vw, 58px); }
.card .kval.mid { font-size: clamp(34px, 4vw, 46px); }
.card.dark { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.card.dark .kdesc { color: rgba(247,244,240,0.7); }
.card.dark .eyebrow { color: rgba(247,244,240,0.5); }

/* donut */
.donut-row { display: flex; align-items: center; gap: 20px; }
.donut { --p: 0; --size: 116px; width: var(--size); height: var(--size); flex: none; position: relative; }
.donut::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--red) calc(var(--p) * 1%), rgba(26,26,26,0.09) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent 60%, #000 61%);
  mask: radial-gradient(farthest-side, transparent 60%, #000 61%);
}
.donut .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.donut .center b { font-family: "Instrument Serif", serif; font-size: 30px; line-height: 1; }

/* ── Revenue breakdown bars ── */
.bars { display: grid; gap: 18px; }
.bar-item { display: grid; gap: 8px; }
.bar-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bar-top .nm { font-family: "Instrument Serif", serif; font-size: 24px; }
.bar-top .nm small { font-family: "Inter", sans-serif; font-size: 12px; color: var(--muted);
  display: block; font-weight: 500; letter-spacing: 0.02em; margin-top: 2px; }
.bar-top .amt { font-weight: 600; font-size: 15px; white-space: nowrap; }
.bar-top .amt span { color: var(--muted); font-weight: 500; }
.bar-track { height: 14px; background: rgba(26,26,26,0.07); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2,.7,.2,1); }
.bar-fill.hustle { background: var(--ink); }
.bar-fill.love { background: var(--red); }
.bar-fill.cheat { background: #d98a1f; }

/* ── Bestie / Leak feature cards ── */
.feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.feature {
  border-radius: 20px; padding: 28px; border: 1px solid var(--line); box-shadow: var(--shadow);
}
.feature.bestie { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.feature.leak { background: var(--card); }
.feature h3 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 30px;
  margin: 8px 0 2px; letter-spacing: -0.01em; }
.feature .who { font-size: 14px; font-weight: 600; opacity: .85; }
.feature.bestie .who { color: var(--cream-on-red); }
.feature .lines { margin: 20px 0 0; border-top: 1px solid rgba(255,255,255,0.14); }
.feature.leak .lines { border-top-color: var(--line); }
.line {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.1); gap: 12px;
}
.feature.leak .line { border-bottom-color: var(--line-soft); }
.line .lk { font-size: 13.5px; opacity: .82; }
.line .lv { font-family: "Instrument Serif", serif; font-size: 21px; }
.line.total { border-bottom: none; padding-top: 14px; }
.line.total .lk { opacity: 1; font-weight: 600; }
.line.total .lv { font-size: 30px; }
.feature.bestie .line.total .lv { color: #ffd9cb; }
.feature.leak .line.total .lv { color: var(--red); }
.reflect { margin-top: 18px; font-family: "Instrument Serif", serif; font-style: italic;
  font-size: 18px; line-height: 1.35; }
.feature.bestie .reflect { color: rgba(247,244,240,0.9); }
.feature.leak .reflect { color: var(--ink); }
.feature .crown { font-size: 30px; line-height: 1; }

/* ── Sorted value table ── */
table.value { width: 100%; border-collapse: collapse; min-width: 820px; }
table.value th {
  text-align: right; font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--muted-2); padding: 15px 16px;
  border-bottom: 1px solid var(--line); white-space: nowrap; background: #FCFBF9;
}
table.value th:first-child { text-align: left; }
table.value td { padding: 14px 16px; text-align: right; border-bottom: 1px solid var(--line-soft);
  font-variant-numeric: tabular-nums; font-size: 14.5px; }
table.value td:first-child { text-align: left; font-weight: 600; }
table.value tbody tr:last-child td { border-bottom: none; }
table.value .lost { color: var(--red); font-weight: 600; }
table.value .lost.zero { color: var(--good); font-weight: 600; }
table.value tr.top-client td:first-child::after { content: " 👑"; }
table.value tfoot td { padding: 15px 16px; text-align: right; font-weight: 700;
  border-top: 2px solid var(--ink); font-size: 14.5px; background: #FCFBF9; }
table.value tfoot td:first-child { text-align: left; }

/* ── Insights ── */
.insights { display: grid; gap: 12px; }
.insight {
  display: flex; gap: 14px; align-items: flex-start; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow);
}
.insight .ic { font-size: 20px; line-height: 1.2; flex: none; }
.insight p { margin: 0; font-size: 16px; line-height: 1.5; }
.insight.warn { border-left: 4px solid var(--red); }
.insight.good { border-left: 4px solid var(--good); }

/* ── Final message ── */
.finale {
  margin-top: 70px; background: var(--ink); color: var(--cream); border-radius: 24px;
  padding: 64px 56px; position: relative; overflow: hidden;
}
.finale::before {
  content: ""; position: absolute; left: -80px; bottom: -120px; width: 340px; height: 340px;
  border-radius: 50%; background: rgba(166,3,3,0.5); filter: blur(10px);
}
.finale .inner { position: relative; max-width: 760px; }
.finale p { font-family: "Instrument Serif", serif; font-size: clamp(28px, 4vw, 44px);
  line-height: 1.18; margin: 0 0 18px; letter-spacing: -0.01em; }
.finale p .red { color: #ff8a6b; font-style: italic; }
.finale .kick { font-family: "Inter", sans-serif; font-size: 16px; color: rgba(247,244,240,0.72);
  line-height: 1.6; }
.finale .go { margin-top: 28px; }

/* ── Results hidden until data entered ── */
.results-area { display: none; }
.results-area.visible { display: block; }

/* ── responsive ── */
@media (max-width: 920px) {
  .dash { grid-template-columns: 1fr; }
  .feature-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .shell { padding: 0 16px 80px; }
  .trio { grid-template-columns: 1fr; }
  .finale { padding: 44px 26px; }
}

/* ── print / PDF ── */
@media print {
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  body { background: var(--cream) !important; }
  .topbar, .add-row, .tbl-foot, td.del, .delbtn, .no-print,
  .waiting-dash { display: none !important; }
  .results-area { display: block !important; }
  .card { background: var(--card) !important; break-inside: avoid; box-shadow: none; }
  .card.dark { background: var(--ink) !important; color: var(--cream) !important; }
  .hero-card { background: var(--red) !important; color: var(--cream) !important; break-inside: avoid; }
  .feature.bestie { background: var(--ink) !important; color: var(--cream) !important; break-inside: avoid; }
  .feature.leak { background: var(--card) !important; break-inside: avoid; }
  .panel { background: var(--card) !important; box-shadow: none; break-inside: avoid; }
  .insight { background: var(--card) !important; box-shadow: none; break-inside: avoid; }
  .finale { background: var(--ink) !important; color: var(--cream) !important; break-inside: avoid; }
  table.clients thead th,
  table.value th { background: #FCFBF9 !important; }
  table.value tfoot td { background: #FCFBF9 !important; }
  .bar-fill.hustle { background: var(--ink) !important; }
  .bar-fill.love { background: var(--red) !important; }
  .bar-fill.cheat { background: #d98a1f !important; }
  .bar-track { background: rgba(26,26,26,0.07) !important; }
  .donut::before { background: conic-gradient(var(--red) calc(var(--p) * 1%), rgba(26,26,26,0.09) 0) !important; }
  .dash, .feature-grid { gap: 12px; }
  .finale { break-inside: avoid; }
  .cell input { border: none; }
  .cell { border-color: transparent !important; background: transparent !important; }
  .shell { padding: 0 20px 40px; }
  @page { margin: 16mm 14mm; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
// ── calc engine ──────────────────────────────────────────────────────────────
const num = (v) => {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : 0;
};

function computeClient(c) {
  const projectValue = num(c.firstRev);
  const repeatValue = num(c.repeatRev);
  const referralValue = num(c.referralRev);
  const totalValue = projectValue + repeatValue + referralValue;

  // Potential per stream:
  // Repeats: if they had any repeat projects, that stream is captured at actual value.
  //          If repeats = 0, the gap is one repeat benchmarked at first project price.
  // Referrals: if they had any referrals, that stream is captured at actual value.
  //            If referrals = 0, the gap is one referral benchmarked at first project price.
  const hasRepeats = num(c.repeatProjects) > 0;
  const hasReferrals = num(c.referrals) > 0;
  const repeatPotential = hasRepeats ? repeatValue : projectValue;
  const referralPotential = hasReferrals ? referralValue : projectValue;
  const potentialValue = projectValue + repeatPotential + referralPotential;

  const hiddenLost = Math.max(0, potentialValue - totalValue);
  const captureRate = potentialValue > 0 ? (totalValue / potentialValue) * 100 : 0;
  const multiple = projectValue > 0 ? totalValue / projectValue : 0;
  const isOneAndDone = num(c.repeatProjects) === 0;
  return { ...c, projectValue, repeatValue, referralValue, totalValue, potentialValue, hiddenLost, captureRate, multiple, isOneAndDone };
}

const sumBy = (arr, fn) => arr.reduce((a, x) => a + fn(x), 0);

function computeSummary(clients) {
  const rows = clients.map((c) => computeClient(c));
  const n = rows.length;
  const realized = sumBy(rows, (r) => r.totalValue);
  const fullPotential = sumBy(rows, (r) => r.potentialValue);
  const hiddenCash = sumBy(rows, (r) => r.hiddenLost);
  const captureRate = fullPotential > 0 ? (realized / fullPotential) * 100 : 0;
  const hustle = sumBy(rows, (r) => r.projectValue);
  const love = sumBy(rows, (r) => r.repeatValue);
  const cheat = sumBy(rows, (r) => r.referralValue);
  const pct = (v) => (realized > 0 ? (v / realized) * 100 : 0);
  const oneAndDone = rows.filter((r) => r.isOneAndDone).length;
  const oneAndDoneRate = n > 0 ? (oneAndDone / n) * 100 : 0;
  const byValue = [...rows].sort((a, b) => b.totalValue - a.totalValue);
  const byLeak = [...rows].sort((a, b) => b.hiddenLost - a.hiddenLost);
  const bestie = byValue[0] || null;
  const leak = byLeak[0] || null;
  return { rows, n, realized, fullPotential, hiddenCash, captureRate, hustle, love, cheat, hustlePct: pct(hustle), lovePct: pct(love), cheatPct: pct(cheat), oneAndDone, oneAndDoneRate, byValue, bestie, leak };
}

function buildInsights(s) {
  const out = [];
  const r0 = (x) => Math.round(x);

  if (s.hustlePct >= 55) {
    out.push({ tone: "warn", text: "Oof! " + r0(s.hustlePct) + "% of your income is coming from the exhausting hamster wheel of chasing brand-new strangers." });
  } else if (s.hustlePct > 0) {
    out.push({ tone: "good", text: "Only " + r0(s.hustlePct) + "% of your money came from first-time invoices. You're actually keeping people around. Look at you go, honey." });
  }

  if (s.cheatPct < 12) {
    out.push({ tone: "warn", text: "Your referral system is taking a little nap. You made just " + r0(s.cheatPct) + "% from recommendations. That's free money you're snoozing on." });
  } else {
    out.push({ tone: "good", text: r0(s.cheatPct) + "% of your revenue walked in through referrals. That's the cheat code, and you're already playing it." });
  }

  if (s.n > 0 && s.oneAndDoneRate >= 40) {
    out.push({ tone: "warn", text: s.oneAndDone + " out of " + s.n + " of your clients were one-and-done. That's a revolving door, honey. People paid once and strolled right back out." });
  } else if (s.n > 1 && s.oneAndDoneRate < 40) {
    out.push({ tone: "good", text: "Less than 40% of your clients were one-and-done. Most people came back, or sent someone. That's a healthy roster, not a leaky bucket." });
  }

  if (s.bestie && s.bestie.multiple >= 3) {
    out.push({ tone: "good", text: s.bestie.name + " was worth " + s.bestie.multiple.toFixed(1) + "x their original project value through repeats and referrals. That client is a case study in what loyalty looks like." });
  } else if (s.bestie && s.bestie.multiple >= 1.5) {
    out.push({ tone: "good", text: s.bestie.name + " brought in " + s.bestie.multiple.toFixed(1) + "x their first project through repeats and referrals. That's exactly what a well-nurtured client relationship looks like." });
  }

  if (s.fullPotential > 0) {
    const captured = r0(s.captureRate);
    const left = r0(100 - s.captureRate);
    if (captured >= 100) {
      out.push({ tone: "good", text: "You captured 100% of your potential value. Every single client came back or sent someone. TBH? This is rare. You've built something people actually trust." });
    } else if (captured >= 75) {
      out.push({ tone: "good", text: "You captured " + captured + "% of your potential value. That's so strong. You're only leaving " + left + "% behind, and that gap is very fixable." });
    } else if (captured >= 50) {
      out.push({ tone: "good", text: "You captured " + captured + "% of your potential value. Solid foundation. The other " + left + "% is just sitting there waiting for us to go get it." });
    } else {
      out.push({ tone: "warn", text: "You captured " + captured + "% of your potential value. The good news? The other " + left + "% is just sitting there waiting for us to go get it." });
    }
  }

  return out.slice(0, 5);
}

// ── app ──────────────────────────────────────────────────────────────────────
const { useState, useMemo, useEffect, useRef } = React;
const fmt$ = (v) => "$" + Math.round(v).toLocaleString("en-US");
const fmtPct = (v) => Math.round(v) + "%";
const uid = () => "c" + Math.random().toString(36).slice(2, 8);
const STORE_KEY = "hidden-cash-clients-v3";

const BLANK_ROW = () => ({ id: uid(), name: "", firstRev: 0, repeatProjects: 0, repeatRev: 0, referrals: 0, referralRev: 0 });

function loadClients() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (Array.isArray(p) && p.length) return p;
    }
  } catch (e) {}
  return [BLANK_ROW()];
}

function clientIsReady(c) {
  return c.name.trim().length > 0 && num(c.firstRev) > 0;
}

function Donut({ pct }) {
  return (
    <div className="donut" style={{ "--p": Math.max(0, Math.min(100, pct)) }}>
      <div className="center"><b>{fmtPct(pct)}</b></div>
    </div>
  );
}

function CurrencyInput({ value, placeholder, onChange, className }) {
  const [raw, setRaw] = useState("");
  const [focused, setFocused] = useState(false);
  const display = focused
    ? raw
: (value === "" ? "" : Number(value).toLocaleString("en-US"));
      return (
    <div className={"cell cur " + (className || "")}>
      <input
        inputMode="decimal"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setRaw(value === 0 ? "" : String(value)); }}
        onBlur={() => { setFocused(false); setRaw(""); }}
        onChange={(e) => { setRaw(e.target.value); onChange(num(e.target.value)); }}
      />
    </div>
  );
}

function NumInput({ value, placeholder, onChange }) {
  const [raw, setRaw] = useState("");
  const [focused, setFocused] = useState(false);
const display = focused ? raw : (value === "" ? "" : String(value));
  return (
    <div className="cell num">
      <input
        inputMode="numeric"
        value={display}
        placeholder={placeholder}
        onFocus={() => { setFocused(true); setRaw(value === 0 ? "" : String(value)); }}
        onBlur={() => { setFocused(false); setRaw(""); }}
        onChange={(e) => { setRaw(e.target.value); onChange(Math.max(0, Math.round(num(e.target.value)))); }}
      />
    </div>
  );
}

function ClientTable({ clients, setClients }) {
  const firstInputRef = useRef(null);

  const update = (id, key, val) =>
    setClients((cs) => cs.map((c) => (c.id === id ? { ...c, [key]: val } : c)));
  const remove = (id) => setClients((cs) => {
    const next = cs.filter((c) => c.id !== id);
    return next.length === 0 ? [BLANK_ROW()] : next;
  });
  const add = () => setClients((cs) => [...cs, BLANK_ROW()]);

  return (
    <div className="panel">
      <div className="tbl-wrap">
        <table className="clients">
          <thead>
            <tr>
              <th>Client Name</th>
              <th className="num">First Project</th>
              <th className="num">Repeat Projects</th>
              <th className="num">Total Repeat $</th>
              <th className="num">Referrals</th>
              <th className="num">Referral $</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {clients.map((c, i) => (
              <tr key={c.id}>
                <td>
                  <div className="cell name">
                    <input
                      ref={i === 0 ? firstInputRef : null}
                      value={c.name}
                      placeholder="Client name"
                      onChange={(e) => update(c.id, "name", e.target.value)}
                    />
                  </div>
                </td>
                <td><CurrencyInput className="num" value={c.firstRev} placeholder="5,000"
                  onChange={(v) => update(c.id, "firstRev", v)} /></td>
                <td><NumInput value={c.repeatProjects} placeholder="2"
                  onChange={(v) => update(c.id, "repeatProjects", v)} /></td>
                <td><CurrencyInput className="num" value={c.repeatRev} placeholder="10,000"
                  onChange={(v) => update(c.id, "repeatRev", v)} /></td>
                <td><NumInput value={c.referrals} placeholder="1"
                  onChange={(v) => update(c.id, "referrals", v)} /></td>
                <td><CurrencyInput className="num" value={c.referralRev} placeholder="5,000"
                  onChange={(v) => update(c.id, "referralRev", v)} /></td>
                <td className="del">
                  <button className="delbtn" title="Remove client" onClick={() => remove(c.id)}>×</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="tbl-foot">
        <button className="add-row" onClick={add}>+ Add Another Client</button>
        <span className="foot-note">{clients.length} client{clients.length === 1 ? "" : "s"} · changes save automatically</span>
      </div>
    </div>
  );
}

function Dashboard({ s }) {
  return (
    <div className="dash">
      <div className="hero-card">
        <div className="klabel"><span className="eyebrow">Hidden cash left on the table</span></div>
        <div className="kval">{s.hiddenCash <= 0 ? "$0" : fmt$(s.hiddenCash)}</div>
        <div className="breathe">{s.hiddenCash <= 0 ? "You nailed it, honey." : "Take a deep breath, honey."} <span className="pulse"></span></div>
        <div className="kdesc">
          {s.hiddenCash <= 0
            ? "Every client came back or sent someone. You captured every dollar on the table. That's the whole game, and you're already winning it."
            : "This is the money that was sitting right in front of your face, if you'd maximized each client to just one more project and one referral. It's a lot, right? Don't panic. It just means your business has way more potential than you thought."
          }
        </div>
      </div>
      <div className="col">
        <div className="card">
          <div className="klabel"><span className="eyebrow">Wealth Capture Rate</span></div>
          <div className="donut-row">
            <Donut pct={s.captureRate} />
            <div className="kdesc" style={{ marginTop: 0 }}>
              How much of your potential client equity you actually locked down.
              {s.captureRate >= 100
                ? <em> You got it all. Seriously.</em>
                : <em> (Anything under 50% just means we've got some fun work to do, honey.)</em>
              }
            </div>
          </div>
        </div>
        <div className="trio">
          <div className="card dark">
            <div className="klabel"><span className="eyebrow">Realized Revenue</span></div>
            <div className="kval mid">{fmt$(s.realized)}</div>
            <div className="kdesc">Gross cash you successfully dragged into your bank account from these folks.</div>
          </div>
          <div className="card">
            <div className="klabel"><span className="eyebrow">The Full Potential</span></div>
            <div className="kval mid">{fmt$(s.fullPotential)}</div>
            <div className="kdesc">{s.hiddenCash <= 0 ? "And you hit it. This is what full looks like." : "What your business looks like if you actually showed up for every stream."}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Breakdown({ s }) {
  const max = Math.max(s.hustle, s.love, s.cheat, 1);
  const Row = ({ cls, nm, sub, amt, pct }) => (
    <div className="bar-item">
      <div className="bar-top">
        <div className="nm">{nm}<small>{sub}</small></div>
        <div className="amt">{fmt$(amt)} <span>· {fmtPct(pct)}</span></div>
      </div>
      <div className="bar-track">
        <div className={"bar-fill " + cls} style={{ width: (amt / max) * 100 + "%" }}></div>
      </div>
    </div>
  );
  return (
    <div className="dash" style={{ gridTemplateColumns: "1fr 1.32fr" }}>
      <div className="card">
        <div className="klabel"><span className="eyebrow">One-and-Done Client Rate</span></div>
        <div className="kval big" style={{ color: s.oneAndDoneRate === 0 ? "var(--good)" : "var(--red)" }}>{fmtPct(s.oneAndDoneRate)}</div>
        <div className="kdesc">
          {s.oneAndDone === 0
            ? "None of your clients were one-and-done. Every single one came back, sent someone, or both. That's the kind of business that doesn't need to beg for attention."
            : s.oneAndDone + " of your " + s.n + " clients paid you exactly once and then completely vanished. You went through all that awkward networking and pitching just to let them walk right out the exit door."
          }
        </div>
      </div>
      <div className="card">
        <div className="klabel"><span className="eyebrow">Revenue Breakdown</span></div>
        <div className="bars" style={{ marginTop: 16 }}>
          <Row cls="hustle" nm="The Hustle" sub="First invoices from brand-new strangers" amt={s.hustle} pct={s.hustlePct} />
          <Row cls="love" nm="The Love" sub="Repeat money because you delivered flawlessly" amt={s.love} pct={s.lovePct} />
          <Row cls="cheat" nm="The Cheat Code" sub="Free cash from organic referrals" amt={s.cheat} pct={s.cheatPct} />
        </div>
      </div>
    </div>
  );
}

function Features({ s }) {
  const b = s.bestie, l = s.leak;
  if (!b || !l) return null;
  return (
    <div className="feature-grid">
      <div className="feature bestie">
        <div className="crown">👑</div>
        <h3>Your Business Bestie</h3>
        <div className="who">{b.name || "Unnamed client"} · Top Client</div>
        <div className="lines">
          <div className="line"><span className="lk">First hello</span><span className="lv">{fmt$(b.projectValue)}</span></div>
          <div className="line"><span className="lk">Round two &amp; beyond</span><span className="lv">{fmt$(b.repeatValue)}</span></div>
          <div className="line"><span className="lk">Their friends' money</span><span className="lv">{fmt$(b.referralValue)}</span></div>
          <div className="line total"><span className="lk">Total extracted value</span><span className="lv">{fmt$(b.totalValue)}</span></div>
        </div>
        <div className="reflect">What made this relationship so magical? And how do we make every other client feel exactly like this one?</div>
      </div>
      <div className="feature leak">
        <div className="crown">{l.hiddenLost === 0 ? "✅" : "💸"}</div>
        <h3>{l.hiddenLost === 0 ? "No Leaks Found" : "Biggest Cash Leak"}</h3>
        <div className="who">{l.name || "Unnamed client"}</div>
        <div className="lines">
          <div className="line"><span className="lk">Original project</span><span className="lv">{fmt$(l.projectValue)}</span></div>
          <div className="line"><span className="lk">Repeat revenue</span><span className="lv">{fmt$(l.repeatValue)}</span></div>
          <div className="line"><span className="lk">Referral revenue</span><span className="lv">{fmt$(l.referralValue)}</span></div>
          <div className="line total"><span className="lk">Hidden cash lost</span><span className="lv">{fmt$(l.hiddenLost)}</span></div>
        </div>
        <div className="reflect">{l.hiddenLost === 0 ? "Every client on this roster came back or sent someone. There is nothing to fix here." : "This client trusted you once. What happened after that, honey?"}</div>
      </div>
    </div>
  );
}

function ValueTable({ s }) {
  const tot = (fn) => s.rows.reduce((a, r) => a + fn(r), 0);
  return (
    <div className="panel">
      <div className="tbl-wrap">
        <table className="value">
          <thead>
            <tr>
              <th>Client</th>
              <th>First Project</th>
              <th>Repeat</th>
              <th>Referral</th>
              <th>Total Value</th>
              <th>Full Potential</th>
              <th>Hidden Cash Lost</th>
            </tr>
          </thead>
          <tbody>
            {s.byValue.map((r, i) => (
              <tr key={r.id} className={i === 0 ? "top-client" : ""}>
                <td>{r.name || "Unnamed client"}</td>
                <td>{fmt$(r.projectValue)}</td>
                <td>{fmt$(r.repeatValue)}</td>
                <td>{fmt$(r.referralValue)}</td>
                <td>{fmt$(r.totalValue)}</td>
                <td>{fmt$(r.potentialValue)}</td>
                <td className={"lost " + (r.hiddenLost === 0 ? "zero" : "")}>{fmt$(r.hiddenLost)}</td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr>
              <td>Totals</td>
              <td>{fmt$(tot((r) => r.projectValue))}</td>
              <td>{fmt$(tot((r) => r.repeatValue))}</td>
              <td>{fmt$(tot((r) => r.referralValue))}</td>
              <td>{fmt$(s.realized)}</td>
              <td>{fmt$(s.fullPotential)}</td>
              <td className="lost">{fmt$(s.hiddenCash)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  );
}

function Insights({ items }) {
  return (
    <div className="insights">
      {items.map((it, i) => (
        <div key={i} className={"insight " + it.tone}>
          <span className="ic">{it.tone === "warn" ? "🔎" : "✨"}</span>
          <p>{it.text}</p>
        </div>
      ))}
    </div>
  );
}

function exportCSV(s) {
  const head = ["Client", "First Project Revenue", "Repeat Projects", "Repeat Revenue", "Referrals", "Referral Revenue", "Total Client Value", "Potential Client Value", "Hidden Cash Lost"];
  const rows = s.byValue.map((r) => [r.name || "Unnamed", r.projectValue, r.repeatProjects, r.repeatValue, r.referrals, r.referralValue, r.totalValue, r.potentialValue, r.hiddenLost]);
  rows.push([]);
  rows.push(["TOTALS", "", "", "", "", "", s.realized, s.fullPotential, s.hiddenCash]);
  rows.push(["Wealth Capture Rate", Math.round(s.captureRate) + "%"]);
  rows.push(["One-and-Done Rate", Math.round(s.oneAndDoneRate) + "%"]);
  const esc = (v) => { const t = String(v ?? ""); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const csv = [head, ...rows].map((r) => r.map(esc).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hidden-cash-report.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── main App ─────────────────────────────────────────────────────────────────
function App() {
  const [clients, setClients] = useState(loadClients);

  useEffect(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(clients)); } catch (e) {}
  }, [clients]);

  const readyClients = useMemo(() => clients.filter(clientIsReady), [clients]);
  const hasResults = readyClients.length >= 1;

  const s = useMemo(() => computeSummary(readyClients), [readyClients]);
  const insights = useMemo(() => buildInsights(s), [s]);

  return (
    <div className="shell">
      <div className="topbar">
        <div className="brand">
          <span className="dot"></span>
          <span className="wm">Hidden Cash Calculator</span>
        </div>
        <div className="toolbtns">
          <button className="btn btn--ghost" onClick={() => hasResults && exportCSV(s)} style={{ opacity: hasResults ? 1 : 0.38, pointerEvents: hasResults ? "auto" : "none" }}>↧ Export CSV</button>
          <button className="btn btn--red" onClick={() => window.print()}>⎙ Save as PDF</button>
        </div>
      </div>

      <header className="hero-head">
        <h1>Hidden Cash<br /><span className="ital">Calculator</span></h1>
        <div className="lede">
          <span className="sass">Amateurs only count the first invoice.</span>
          <span className="muted">Use this to see how much extra cash is secretly hiding in your business right now and exactly where you're accidentally dropping it on the floor.</span>
        </div>
      </header>

      <div className="sec-head">
        <span className="no">01</span>
        <h2>Your Client Roster</h2>
        <span className="hint">Fill in your real clients. Every number recalculates live.</span>
      </div>
      <ClientTable clients={clients} setClients={setClients} />

      <div className={"results-area" + (hasResults ? " visible" : "")}>

        <div className="sec-head"><span className="no">02</span><h2>{s.hiddenCash <= 0 ? "The Clean Report" : "The Damage Report"}</h2></div>
        <Dashboard s={s} />

        <div className="sec-head"><span className="no">03</span><h2>Where the Money Comes From</h2></div>
        <Breakdown s={s} />

        {readyClients.length >= 2 && (
          <>
            <div className="sec-head"><span className="no">04</span><h2>Best Friend &amp; Worst Leak</h2></div>
            <Features s={s} />
          </>
        )}

        <div className="sec-head">
          <span className="no">{readyClients.length >= 2 ? "05" : "04"}</span>
          <h2>Every Client, Ranked</h2>
          <span className="hint">Sorted by total value: highest to lowest.</span>
        </div>
        <ValueTable s={s} />

        <div className="sec-head">
          <span className="no">{readyClients.length >= 2 ? "06" : "05"}</span>
          <h2>What We're Seeing, Honey</h2>
        </div>
        <Insights items={insights} />

        <section className="finale">
          <div className="inner">
            {s.hiddenCash <= 0 ? (
              <>
                <p>You left <span className="red">nothing</span> on the table. Your clients came back, sent friends, and paid you again. That's not luck, that's a business that actually works (and I'm so freaking proud!!!)</p>
                <p className="kick">Most freelancers never get here. They spend their whole career chasing the next stranger instead of nurturing the people already in the room. You figured out the hard part. Now scale it.</p>
              </>
            ) : s.hiddenCash < s.realized * 0.15 ? (
              <>
                <p>You're only leaving <span className="red">{fmt$(s.hiddenCash)}</span> behind. That's a small gap, and it means your client relationships are genuinely strong.</p>
                <p className="kick">You're already playing the long game, honey. Close that last gap and you've got one of the tightest freelance businesses out there.</p>
              </>
            ) : (
              <>
                <p>If you're losing <span className="red">{fmt$(s.hiddenCash)}</span> with the people who already like you and trust you… why the hell are you out there begging for new ones?</p>
                <p className="kick">You don't need to chase more strangers, honey. You just need to learn how to keep the clients you've already got from slipping right through your fingers. Let's fix this.</p>
              </>
            )}
            <div className="go no-print">
              <button className="btn btn--red" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}>
                ↑ Back to the top
              </button>
            </div>
          </div>
        </section>

      </div>

      {!hasResults && (
        <div style={{ marginTop: 32 }}>
          <div className="waiting-dash">
            <div className="wi">💡</div>
            <p>Your results will appear here as soon as you add a client name and a first project value above.</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
