document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

sents<\u002Fa>\n        <span style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; color: #1A1A1A;\">[$] Free tool<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 40px clamp(32px, 5vw, 80px); align-items: end; margin-top: clamp(32px, 4vw, 48px);\">\n        <div style=\"min-width: 0;\">\n          <h1 style=\"margin: 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: clamp(44px, 8vw, 96px); line-height: 0.92; letter-spacing: -0.03em; text-transform: uppercase;\">Your year in <span style=\"background: #1A1A1A; color: #F7F4F0; padding: 0 0.08em; display: inline-block; line-height: 1;\">revenue<\u002Fspan><\u002Fh1>\n          <p style=\"margin: 24px 0 0; font-weight: 600; font-size: clamp(17px, 1.6vw, 19px); line-height: 1.5; max-width: 560px; text-wrap: pretty;\">See what your freelance revenue is doing across your year.<\u002Fp>\n          <p style=\"margin: 8px 0 0; font-size: clamp(16px, 1.4vw, 17px); line-height: 1.55; max-width: 560px; text-wrap: pretty;\">Type in what you earned each month. I'll show you how your income is spread across your year, and what stands out.<\u002Fp>\n        <\u002Fdiv>\n        <aside aria-label=\"Privacy\" style=\"position: relative; background: #F7F4F0; color: #1A1A1A; padding: 32px 24px 24px; transform: rotate(1deg); max-width: 440px; justify-self: end; width: 100%;\">\n          <span aria-hidden=\"true\" style=\"position: absolute; top: -12px; left: 50%; width: 104px; height: 26px; margin-left: -52px; background: #C8C2BA; transform: rotate(-2deg);\"><\u002Fspan>\n          <div style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;\">[!] Your privacy<\u002Fdiv>\n          <p style=\"margi " sc-camel-on-change=\"{{ f.onInput }}\" sc-camel-on-blur=\"{{ f.onBlur }}\" style=\"width: 100%; min-width: 0; min-height: 48px; border: 2px solid #1A1A1A; border-radius: 0; background: {{ f.bg }}; color: {{ f.color }}; padding: 10px 8px 10px {{ f.pad }}; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 18px;\" style-focus=\"outline: none; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 6px #1A1A1A;\">\n                <\u002Fdiv>\n                <label style=\"display: flex; align-items: flex-start; gap: 8px; font-size: 15px; line-height: 1.35; cursor: pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ f.skipped }}\" sc-camel-on-change=\"{{ f.onSkip }}\" style=\"width: 20px; height: 20px; margin: 0; flex: none; accent-color: #1A1A1A; cursor: pointer;\" style-focus=\"outline: none; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 6px #1A1A1A;\">\n                  <span>I don't have this month<\u002Fspan>\n                <\u002Flabel>\n                <sc-if value=\"{{ f.hasMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p id=\"{{ f.msgId }}\" style=\"margin: 0; display: flex; gap: 6px; border-left: 4px solid #1A1A1A; padding-left: 8px; font-size: 15px; line-height: 1.4;\"><span style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; flex: none;\">[!]<\u002Fspan><span>{{ f.msg }}<\u002Fspan><\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Ffieldset>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section aria-labelledby=\"report-h\" style=\"max-width: 1296px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px) 0;\">\n      <div style=\"border-top: 4px solid #1A1A1A; padding-top: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;\">\n        <sc-if value=\"{{ hasReport }}\" hint-placeholder-val=\"{{ false }}\"><div data-print-hide=\"\" 02Fsc-if>\n\n      <sc-if value=\"{{ hasReport }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding-top: 32px;\">\n          <sc-if value=\"{{ isPartial }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"status\" style=\"display: flex; gap: 12px; background: #EDE9E3; border-left: 6px solid #1A1A1A; padding: 16px 20px; margin-bottom: 32px; max-width: 900px;\">\n              <span style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; flex: none; padding-top: 2px;\">[i]<\u002Fspan>\n              <span style=\"font-size: 16px;\">{{ partialText }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <p style=\"margin: 0; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;\">In one sentence<\u002Fp>\n          <p style=\"margin: 8px 0 0; font-weight: 700; font-size: clamp(20px, 2vw, 24px); line-height: 1.3; max-width: 820px; text-wrap: pretty;\">{{ summary }}<\u002Fp>\n\n          <div data-print-stack=\"\" style=\"display: grid; grid-template-columns: {{ resultCols }}; gap: clamp(40px, 5vw, 64px); margin-top: clamp(48px, 6vw, 64px); align-items: start;\">\n            <div style=\"min-width: 0;\">\n              <p style=\"margin: 0; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;\">{{ totalLabel }}<\u002Fp>\n              <p style=\"margin: 8px 0 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: {{ bigSize }}; line-height: 0.92; letter-spacing: -0.03em; overflow-wrap: anywhere;\">{{ totalText }}<\u002Fp>\n              <p style=\"margin: 16px 0 0; font-size: 17px; max-width: 360px;\">{{ bigSentence }}<\u002Fp>\n            <\u002Fdiv>\n\n            <figure style=\"margin: 0; min-width: 0;\">\n              <figcaption style=\"font-weight: 700; font-size: 20px; line-height: 1.2;\">Your year, month by month<\u002Ffigcaption>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.02em;\">\n                <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 14px; height: 14px; background: #A70101;\"><\u002Fspan>Best month<\u002Fspan>\n                <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 24px; border-top: 2px dashed #8F887F;\"><\u002Fspan>Average<\u002Fspan>\n                <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 24px; border-top: 2px dotted #1A1A1A;\"><\u002Fspan>Middle month<\u002Fspan>\n                <sc-if value=\"{{ showBand }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 14px; height: 14px; background: #E8E4DF; border: 1px solid #C8C2BA;\"><\u002Fspan>Quietest stretch<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div role=\"img\" aria-label=\"{{ chartAria }}\" style=\"margin-top: 32px; padding-left: 44px;\">\n                <div style=\"position: relative; height: {{ chartH }}; border-bottom: 2px solid #1A1A1A;\">\n                  <sc-for list=\"{{ ticks }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <div style=\"position: absolute; left: 0; right: 0; bottom: {{ t.bottom }}; border-top: 1px solid #E8E4DF;\">\n                      <span style=\"position: absolute; right: 100%; margin-right: 8px; top: 0; transform: translateY(-50%); font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; line-height: 1;\">{{ t.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"position: abso FFF; padding: 0 4px; white-space: nowrap; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; line-height: 1.2;\">MIDDLE {{ medLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: {{ barGap }}; margin-top: 8px;\">\n                  <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"12\">\n                    <span style=\"text-align: center; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; line-height: 1; overflow: hidden;\">{{ b.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <button type=\"button\" data-print-hide=\"\" aria-expanded=\"{{ tableOpenStr }}\" aria-controls=\"numbers-table\" sc-camel-on-click=\"{{ toggleTable }}\" style=\"margin-top: 24px; background: transparent; border: 0; padding: 8px 0; min-height: 44px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #1A1A1A; cursor: pointer; text-decoration: underline; text-underline-offset: 4px;\" style-hover=\"color: #A70101;\" style-focus=\"outline: none; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 6px #1A1A1A;\">{{ tableBtn }}<\u002Fbutton>\n              <div id=\"numbers-table\" style=\"{{ tableWrapStyle }}\">\n                <sc-raw-table style=\"width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px;\">\n                  <sc-raw-caption style=\"text-align: left; font-weight: 700; padding-bottom: 8px;\">Your numbers, month by month<\u002Fsc-raw-caption>\n                  <sc-raw-thead>\n                    <sc-raw-tr style=\"border-bottom: 2px solid #1A1A1A;\">\n                      <sc-raw-th scope=\"col\" style=\"text-align: left; padding: 8px 8px 8px 0; font-weight: 700;\">Month<\u002Fsc-raw-th>\n                      <sc-raw-th scope=\"col\" style=\"text-align: right; padding: 8px; font-weight: 700;\">Earned<\u002Fsc-raw-th>\n                      <sc-raw-th scope=\"col\" style=\"text-align: right; padding: 8px; font-weight: 700;\">Over or under average<\u002Fsc-raw-th>\n                      <sc-raw-th scope=\"col\" style=\"text-align: right; padding: 8px 0 8px 8px; font-weight: 700;\">Share of year<\u002Fsc-raw-th>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                      <sc-raw-tr style=\"border-bottom: 1px solid #E8E4DF;\">\n                        <sc-raw-th scope=\"row\" style=\"text-align: left; padding: 8px 8px 8px 0; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700;\">{{ r.month }}<\u002Fsc-raw-th>\n                        <sc-raw-td style=\"text-align: right; padding: 8px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; white-space: nowrap;\">{{ r.earned }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"text-align: right; padding: 8px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; white-space: nowrap;\">{{ r.diff }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"text-align: right; padding: 8px 0 8px 8px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700;\">{{ r.share }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                  <sc-raw-tfoot>\n                    <sc-raw-tr style=\"border-top: 2px solid #1A1A1A;\">\n                      <sc-raw-th scope=\"row\" style=\"text-align: left; padding: 8px 8px 8px 0; font-weight: 700;\">Total<\u002Fsc-raw-th>\n                      <sc-raw-td style=\"text-align: right; padding: 8px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; white-space: nowrap;\">{{ tableTotal }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"text-align: right; padding: 8px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; white-space: nowrap;\">{{ tableAvg }} avg<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"text-align: right; padding: 8px 0 8px 8px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700;\">100%<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-tfoot>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Ffigure>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"5\">\n            <section style=\"margin-top: clamp(64px, 7vw, 96px);\">\n              <div style=\"display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;\">\n                <span style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px;\">{{ g.num }}<\u002Fspan>\n                <h3 style=\"margin: 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: clamp(28px, 3.2vw, 40px); line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase;\">{{ g.title }}<\u002Fh3>\n              <\u002Fdiv>\n              <sc-if value=\"{{ g.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin: 12px 0 0; font-size: 16px; max-width: 640px;\">{{ g.note }}<\u002Fp>\n              <\u002Fsc-if>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 32px clamp(24px, 3vw, 40px); margin-top: 32px;\">\n                <sc-for list=\"{{ g.cards }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <article style=\"border-top: 2px solid #1A1A1A; padding-top: 16px; min-width: 0;\">\n                    <span style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px;\">{{ c.num }}<\u002Fspan>\n                    <h4 style=\"margin: 8px 0 0; font-weight: 700; font-size: 20px; line-height: 1.25; text-wrap: pretty;\">{{ c.heading }}<\u002Fh4>\n                    <sc-for list=\"{{ c.lines }}\" as=\"line\" hint-placeholder-count=\"2\">\n                      <p style=\"margin: 12px 0 0; font-size: clamp(16px, 1.4vw, 17px); line-height: 1.55; text-wrap: pretty;\">{{ line }}<\u002Fp>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ c.hasMini }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div aria-hidden=\"true\" style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 20px;\">\n                        <sc-for list=\"{{ c.mini }}\" as=\"m\" hint-placeholder-count=\"2\">\n                          <div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr) 44px; align-items: center; gap: 12px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px;\">\n                            <span style=\"white-space: nowrap;\">{{ m.label }}<\u002Fspan>\n                            <span style=\"display: block; height: 16px; background: #E8E4DF;\"><span style=\"display: block; height: 100%; width: {{ m.width }}; background: {{ m.color }};\"><\u002Fspan><\u002Fspan>\n                            <span style=\"text-align: right;\">{{ m.value }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Farticle>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-for>\n\n          <section aria-labelledby=\"stands-h\" style=\"margin-top: clamp(64px, 7vw, 96px); background: #1A1A1A; color: #F7F4F0; padding: clamp(32px, 5vw, 64px) clamp(20px, 5vw, 64px);\">\n            <h3 id=\"stands-h\" style=\"margin: 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: clamp(32px, 3.8vw, 44px); line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase;\">What stands out for <span style=\"background: #A70101; padding: 0 0.08em; display: inline-block; line-height: 1;\">you<\u002Fspan><\u002Fh3>\n            <ol style=\"list-style: none; margin: 40px 0 0; padding: 0; display: flex; flex-direction: column; gap: 24px; max-width: 820px;\">\n              <sc-for list=\"{{ findings }}\" as=\"fd\" hint-placeholder-count=\"3\">\n                <li style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; border-top: 1px solid #5A5550; padding-top: 20px;\">\n                  <span style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 16px; padding-top: 3px;\">{{ fd.num }}<\u002Fspan>\n                  <span style=\"font-weight: 600; font-size: clamp(17px, 1.6vw, 19px); line-height: 1.5; text-wrap: pretty;\">{{ fd.text }}<\u002Fspan>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n            <p style=\"margin: 40px 0 0; font-size: 15px; line-height: 1.5; max-width: 720px;\">This is about revenue, not profit or take home pay, and it isn't tax, accounting, or investment advice. One year of numbers shows patterns, but it can't prove a seasonal cycle.<\u002Fp>\n          <\u002Fsection>\n\n          <sc-if value=\"{{ showPattern }}\" hint-placeholder-val=\"{{ false }}\">\n            <section aria-labelledby=\"pattern-h\" style=\"margin-top: clamp(48px, 6vw, 64px); max-width: 760px;\">\n              <p style=\"margin: 0; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;\">[?] Pattern check<\u002Fp>\n              <h3 id=\"pattern-h\" style=\"margin: 8px 0 0; font-weight: 700; font-size: clamp(20px, 2vw, 24px); line-height: 1.2;\">Do the same months stay quiet?<\u002Fh3>\n              <p style=\"margin: 12px 0 0; font-size: clamp(16px, 1.4vw, 17px);\">{{ patternText }}<\u002Fp>\n            <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ hasReport }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-print-hide=\"\" style=\"max-width: 1296px; margin: 0 auto; padding: clamp(64px, 8vw, 96px) clamp(16px, 4vw, 48px) clamp(64px, 8vw, 96px);\">\n      <h2 style=\"margin: 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: clamp(40px, 5.4vw, 64px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; text-wrap: balance;\">Lumpy is <span style=\"background: #1A1A1A; color: #FFFFFF; padding: 0 0.08em; display: inline-block; line-height: 1;\">normal<\u002Fspan>. Plan for it.<\u002Fh2>\n      <p style=\"margin: 24px 0 0; font-size: clamp(17px, 1.6vw, 19px); max-width: 640px; text-wrap: pretty;\">A single month never tells you the whole story. Look at your whole year before you decide what your business has room for (including that vacation).<\u002Fp>\n    <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <footer>\n    <div style=\"background: #A70101; color: #F7F4F0;\">\n      <div style=\"max-width: 1296px; margin: 0 auto; padding: 48px clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: 24px 32px;\">\n        <img src=\"a57158ed-b19a-4c3a-b375-afa8bb7aeff8\" alt=\"YFF\" width=\"130\" height=\"61\" style=\"display: block; width: 130px; height: auto; flex: none;\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <span style=\"font-weight: 700; font-size: 19px;\">Sabrina S. Santiago<\u002Fspan>\n          <span style=\"font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.04em;\">YOUR FAVORITE FREELANCER<\u002Fspan>\n        <\u002Fdiv>\n        <span data-print-only=\"\" style=\"display: none; margin-left: auto; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;\">Made with the free Your Year in Revenue tool<\u002Fspan>\n        <nav aria-label=\"More from Sabrina\" data-print-hide=\"\" style=\"margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px 24px; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: 14px;\">\n          <a href=\"https://sabrinassantiago.myflodesk.com/contracts\" style=\"color: #F7F4F0;\" style-hover=\"color: #1A1A1A;\">Newsletter<\u002Fa>\n          <a href=\"https://sabrinassantiago.myflodesk.com/contracts\" style=\"color: #F7F4F0;\" style-hover=\"color: #1A1A1A;\">Tools<\u002Fa>\n          <a href=\"https://sabrinassantiago.beehiiv.com/products/your-favorite-bureaucracy\" style=\"color: #F7F4F0;\" style-hover=\"color: #1A1A1A;\">Contract kit<\u002Fa>\n        <\u002Fnav>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showAllBarValues&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chart&quot;},&quot;highlightQuietStretch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chart&quot;}}\">\nconst CURRENCIES = [\n  ['$', 'US dollar'], ['€', 'Euro'], ['£', 'British pound'], ['¥', 'Japanese yen'], ['CN¥', 'Chinese yuan'],\n  ['C$', 'Canadian dollar'], ['A$', 'Australian dollar'], ['CHF ', 'Swiss franc'], ['HK$', 'Hong Kong dollar'], ['S$', 'Singapore dollar'],\n  ['₹', 'Indian rupee'], ['R$', 'Brazilian real'], ['MX$', 'Mexican peso'], ['₩', 'South Korean won'], ['NZ$', 'New Zealand dollar'],\n  ['SEK ', 'Swedish krona'], ['NOK ', 'Norwegian krone'], ['PLN ', 'Polish złoty'], ['₺', 'Turkish lira'], ['ZAR ', 'South African rand'],\n];\nclass Component extends DCLogic {\n  state = {\n    ready: false, currency: '$', start: 0,\n    raw: Array(12).fill(''), skip: Array(12).fill(false), touched: Array(12).fill(false),\n    year2: false, raw2: Array(12).fill(''), skip2: Array(12).fill(false), touched2: Array(12).fill(false),\n    example: false, committed: null, w: typeof window !== 'undefined' ? window.innerWidth : 1200, tableOpen: false,\n  };\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    new Promise(res => { const t = () => window.RevenueEngine ? res(window.RevenueEngine) : setTimeout(t, 20); t(); }).then(eng => {\n      this.eng = eng;\n      const saved = this.load();\n      this.setState({ ...saved, ready: true }, () => {\n        this.commit(false);\n        if (/[?&]test=1/.test(location.search)) {\n          eng.runTests(console.log);\n          setTimeout(() => {\n            this.tryExample();\n            setTimeout(() => eng.copyAudit(document.body.innerText, console.log), 600);\n          }, 300);\n        }\n      });\n    });\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearTimeout(this.t); }\n\n  load() {\n    try {\n      const d = JSON.parse(localStorage.getItem('yearInRevenue.v1'));\n      if (!d || typeof d !== 'object') return {};\n      const strs = a => Array.isArray(a) && a.length === 12 && a.every(x => typeof x === 'string');\n      const bools = a => Array.isArray(a) && a.length === 12 && a.every(x => typeof x === 'boolean');\n      const out = {};\n      if (CURRENCIES.some(c => c[0] === d.currency)) out.currency = d.currency;\n      if (Number.isInteger(d.start) && d.start >= 0 && d.start < 12) out.start = d.start;\n      if (strs(d.raw)) out.raw = d.raw;\n      if (bools(d.skip)) out.skip = d.skip;\n      if (strs(d.raw2)) out.raw2 = d.raw2;\n      if (bools(d.skip2)) out.skip2 = d.skip2;\n      out.year2 = d.year2 === true;\n      out.example = d.example === true;\n      return out;\n    } catch (e) { return {}; }\n  }\n  save() {\n    const s = this.state;\n    try { localStorage.setItem('yearInRevenue.v1', JSON.stringify({ currency: s.currency, start: s.start, raw: s.raw, skip: s.skip, year2: s.year2, raw2: s.raw2, skip2: s.skip2, example: s.example })); } catch (e) {}\n  }\n  commit(persist = true) {\n    const s = this.state;\n    this.setState({ committed: { currency: s.currency, start: s.start, raw: s.raw, skip: s.skip, year2: s.year2, raw2: s.raw2, skip2: s.skip2 } });\n    if (persist) this.save();\n  }\n  schedule() { clearTimeout(this.t); this.t = setTimeout(() => this.commit(), 150); }\n\n  setField(set, i, val) {\n    this.setState(s => {\n      const k = set === 2 ? 'raw2' : 'raw';\n      const arr = s[k].slice(); arr[i] = val;\n      return set === 2 ? { raw2: arr } : { raw: arr, example: false };\n    }, () => this.schedule());\n  }\n  setSkip(set, i, on) {\n    this.setState(s => {\n      const k = set === 2 ? 'skip2' : 'skip';\n      const arr = s[k].slice(); arr[i] = on;\n      return { [k]: arr };\n    }, () => this.schedule());\n  }\n  touch(set, i) {\n    this.setState(s => { const k = set === 2 ? 'touched2' : 'touched'; if (s[k][i]) return null; const a = s[k].slice(); a[i] = true; return { [k]: a }; });\n  }\n  tryExample = () => {\n    if (!this.eng) return;\n    this.setState({ raw: this.eng.CONFIG.example.map(v => v.toLocaleString('en-US')), skip: Array(12).fill(false), touched: Array(12).fill(false), start: 0, example: true }, () => this.commit());\n  };\n  clearAll = () => {\n    try { localStorage.removeItem('yearInRevenue.v1'); } catch (e) {}\n    this.setState({\n      currency: '$', start: 0, raw: Array(12).fill(''), skip: Array(12).fill(false), touched: Array(12).fill(false),\n      year2: false, raw2: Array(12).fill(''), skip2: Array(12).fill(false), touched2: Array(12).fill(false), example: false,\n    }, () => this.commit(false));\n  };\n\n  fieldList(set, E, s) {\n    const raw = set === 2 ? s.raw2 : s.raw, skip = set === 2 ? s.skip2 : s.skip, touched = set === 2 ? s.touched2 : s.touched;\n    const filled = raw.filter((r, i) => !skip[i] && r.trim() !== '').length;\n    const sym = s.currency;\n    return raw.map((r, i) => {\n      const m = (s.start + i) % 12;\n      const p = E ? E.parseAmount(r) : { state: r ? 'ok' : 'empty' };\n      let msg = '';\n      if (!skip[i]) {\n        if (p.state === 'negative') msg = \"Revenue can't be negative here. If you had refunds, enter what you kept for that month.\";\n        else if (p.state === 'invalid') msg = \"That doesn't look like a number. Try something like 4500 or 4,500.50.\";\n        else if (p.state === 'empty' && (touched[i] || filled >= 6)) msg = 'Add a number here (type 0 if you earned nothing), or check \"I don\\'t have this month\".';\n      }\n      const id = `m${set}-${i}`;\n      return {\n        id, msgId: id + '-msg', label: (E ? E.MONTHS[m] : '') + (set === 2 ? ', year before' : ''),\n        raw: r, skipped: skip[i], hasMsg: !!msg, msg, invalid: p.state === 'negative' || p.state === 'invalid' ? 'true' : 'false',\n        sym, pad: sym.length > 1 ? '36px' : '26px',\n        bg: skip[i] ? '#E8E4DF' : '#EDE9E3', color: skip[i] ? '#6B655E' : '#1A1A1A',\n        onInput: e => this.setField(set, i, e.target.value),\n        onBlur: () => this.touch(set, i),\n        onSkip: e => this.setSkip(set, i, e.target.checked),\n      };\n    });\n  }\n\n  buildReport(E, c) {\n    const parsed = c.raw.map(r => E.parseAmount(r));\n    const vals = parsed.map((p, i) => (!c.skip[i] && p.state === 'ok' ? p.value : null));\n    const count = vals.filter(v => v !== null).length;\n    if (count < E.CONFIG.minMonths) return { status: 'empty' };\n    if (vals.every(v => v === null || v === 0)) return { status: 'zeros' };\n    const full = count === 12;\n    const r = full ? E.computeReport(vals, c.start) : E.computePartial(vals, c.start);\n    let pattern = null;\n    if (full) {\n      if (c.year2) {\n        const v2 = c.raw2.map((x, i) => { const p = E.parseAmount(x); return !c.skip2[i] && p.state === 'ok' ? p.value : null; });\n        pattern = v2.every(v => v !== null)\n          ? E.patternCheck(r, v2, c.start).text\n          : \"Fill in all 12 of those earlier months and I'll compare your quiet stretches.\";\n      } else pattern = E.patternCheck(r, null).text;\n    }\n    return { status: full ? 'full' : 'partial', r, vals, pattern };\n  }\n\n  renderVals() {\n    const s = this.state, E = this.eng;\n    const w = s.w;\n    const narrow = w < 640;\n    const sym = s.currency;\n    const out = {\n      currency: s.currency, start: String(s.start),\n      currencyOptions: CURRENCIES.map(([v, n]) => ({ value: v, label: v.trim() + ' ' + n })),\n      monthOptions: (E ? E.MONTHS : ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']).map((name, i) => ({ value: String(i), name })),\n      onCurrency: e => this.setState({ currency: e.target.value }, () => this.schedule()),\n      onStart: e => this.setState({ start: Number(e.target.value) }, () => this.schedule()),\n      tryExample: this.tryExample, clearAll: this.clearAll, example: s.example,\n      printDate: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),\n      downloadPdf: () => { const t = document.title; document.title = 'Your Year in Revenue - ' + new Date().toISOString().slice(0, 10); window.print(); setTimeout(() => { document.title = t; }, 1000); },\n      fieldCols: `repeat(${w < 640 ? 3 : w < 1000 ? 4 : 6}, minmax(0, 1fr))`,\n      fields: this.fieldList(1, E, s), fields2: s.year2 ? this.fieldList(2, E, s) : [],\n      year2: s.year2, year2Str: s.year2 ? 'true' : 'false',\n      offBg: s.year2 ? '#FFFFFF' : '#1A1A1A', offColor: s.year2 ? '#1A1A1A' : '#F7F4F0',\n      onBg: s.year2 ? '#1A1A1A' : '#FFFFFF', onColor: s.year2 ? '#F7F4F0' : '#1A1A1A',\n      toggleYear2: () => this.setState(st => ({ year2: !st.year2 }), () => this.schedule()),\n      isEmpty: true, isZeros: false, hasReport: false, liveText: '',\n      resultCols: w >= 960 ? 'minmax(0, 4fr) minmax(0, 8fr)' : 'minmax(0, 1fr)',\n      tableOpenStr: s.tableOpen ? 'true' : 'false',\n      tableBtn: s.tableOpen ? '[x] Hide the numbers' : '[+] Show the numbers',\n      toggleTable: () => this.setState(st => ({ tableOpen: !st.tableOpen })),\n      tableWrapStyle: s.tableOpen ? { overflowX: 'auto' } : { position: 'absolute', width: '1px', height: '1px', overflow: 'hidden', clip: 'rect(0 0 0 0)', whiteSpace: 'nowrap' },\n    };\n    if (!E || !s.committed) return out;\n\n    const c = s.committed;\n    const csym = c.currency;\n    const rep = this.buildReport(E, c);\n    if (rep.status === 'empty') { out.liveText = 'Add at least 6 months to see your report.'; return out; }\n    if (rep.status === 'zeros') { out.isEmpty = false; out.isZeros = true; out.liveText = 'Add at least one month above zero to see your report.'; return out; }\n    const r = rep.r, full = rep.status === 'full';\n    const money = v => E.money(v, csym);\n    const findings = E.buildFindings(r, csym);\n    const groups = E.buildCards(r, csym);\n    const showAll = this.props.showAllBarValues ?? false;\n    const showBand = full && (this.props.highlightQuietStretch ?? true);\n\n    // chart scale\n    const max = r.bestValue;\n    const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));\n    const step = [1, 2, 2.5, 5, 10].find(k => k * mag >= raw) * mag;\n    const top = Math.ceil(max / step) * step || 1;\n    const ticks = [];\n    for (let t = 0; t <= top + 1e-9; t += step) ticks.push({ bottom: (t / top * 100) + '%', label: E.shortMoney(t) });\n    const bestPos = r.best.pos;\n    const bars = rep.vals.map((v, pos) => {\n      const m = (c.start + pos) % 12;\n      const isBest = pos === bestPos;\n      const missing = v === null;\n      return {\n        label: narrow ? E.SHORT[m][0] : E.SHORT[m],\n        h: missing ? '0%' : Math.max(v / top * 100, v > 0 ? 0.6 : 0) + '%',\n        color: isBest ? '#A70101' : '#1A1A1A',\n        band: showBand && r.quietestPos.includes(pos) ? '#E8E4DF' : 'transparent',\n        showVal: !missing && (isBest || (showAll && !narrow)),\n        val: narrow || (showAll && !isBest) ? E.shortMoney(v || 0) : Math.round(v || 0).toLocaleString('en-US'),\n        missing,\n      };\n    });\n    const totalWord = full ? 'Total for the year' : `Total for these ${r.n} months`;\n    const totalText = money(r.total);\n    const rows = rep.vals.map((v, pos) => {\n      const m = (c.start + pos) % 12;\n      if (v === null) return { month: E.SHORT[m], earned: 'no data', diff: '', share: '' };\n      const d = v - r.avg;\n      return {\n        month: E.SHORT[m], earned: money(v),\n        diff: Math.round(Math.abs(d)) === 0 ? 'on average' : `${money(Math.abs(d))} ${d > 0 ? 'over' : 'under'}`,\n        share: (v / r.total * 100).toFixed(1) + '%',\n      };\n    });\n    const summary = (findings[0] ? findings[0].text + ' ' : '') + 'Scroll down for the full picture.';\n\n    Object.assign(out, {\n      isEmpty: false, hasReport: true, isPartial: !full,\n      partialText: `This report is based on ${r.n} months, so some parts are hidden. Fill in all 12 for the full picture.`,\n      summary,\n      liveText: 'Report updated. ' + summary,\n      totalLabel: totalWord, totalText,\n      bigSize: totalText.length > 11 ? 'clamp(36px, 5vw, 56px)' : 'clamp(56px, 7vw, 88px)',\n      bigSentence: `Your three best months made ${r.top3Share}% of it.`,\n      showBand,\n      chartH: narrow ? '220px' : '300px',\n      barGap: narrow ? '3px' : '8px', barInset: narrow ? '0px' : '4px',\n      ticks, bars,\n      avgBottom: (r.avg / top * 100) + '%', avgLabel: money(r.avg),\n      medBottom: (r.median / top * 100) + '%', medLabel: money(r.median),\n      chartAria: `Bar chart of revenue for ${r.n} months. Best month ${E.MONTHS[r.bestMonth]} at ${money(r.bestValue)}. Average month ${money(r.avg)}. Middle month ${money(r.median)}. The full numbers are in the table below.`,\n      rows, tableTotal: money(r.total), tableAvg: money(r.avg),\n      groups: groups.map((g, gi) => ({\n        num: `[${gi + 1}]`, title: g.title, hasNote: !!g.note, note: g.note || '',\n        cards: g.cards.map(cd => ({\n          num: '[' + String(cd.id).padStart(2, '0') + ']', heading: cd.heading, lines: cd.lines,\n          hasMini: !!cd.mini, mini: (cd.mini || []).map(m => ({ ...m, color: m.red ? '#A70101' : '#1A1A1A' })),\n        })),\n      })),\n      findings: findings.map((f, i) => ({ num: `[${i + 1}]`, text: f.text })),\n      showPattern: full, patternText: rep.pattern || '',\n    });\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
